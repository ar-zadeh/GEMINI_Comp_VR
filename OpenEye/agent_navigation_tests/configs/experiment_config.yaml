# ============================================================
# Agent Navigation Testing Suite — Experiment Configuration
# ============================================================

# ---------- VLM Endpoint ----------
vlm:
  url: "http://localhost:8000/v1/chat/completions"
  model: "Firworks/Cosmos-Reason2-8B-nvfp4"
  max_tokens: 150
  temperature: 0.7

# ---------- Global Settings ----------
settings:
  strategies: ["freespace", "clockface"]   # Navigation strategies to compare
  num_runs: 5                               # Runs per (strategy × scenario) for consistency
  max_steps: 50                             # Maximum VLM query ticks per run
  query_interval: 1.0                       # Seconds between VLM queries
  history_length: 3                         # Conversation history window (0 = stateless)
  walk_tick: 0.5                            # Seconds between forward-walk pulses

  # Position-based stuck detection
  stuck_position_threshold: 0.05            # Metres; if agent moves less than this between ticks → stuck
  stuck_consecutive_limit: 3                # Consecutive stuck ticks before flagging

# ---------- Test 1: Unobstructed Exploration ----------
test1_exploration:
  enabled: true
  description: "Evaluate how far the agent explores in open space without a goal."
  prompt_file: "agent_navigation_tests/configs/task1_prompts.yaml"

# ---------- Test 2: Goal-Oriented Walking ----------
test2_goal_walking:
  enabled: true
  description: "Navigate towards a described goal location."
  prompt_file: "agent_navigation_tests/configs/task2_prompts.yaml"

  # Multiple goals — record headset pose at each goal location and fill in here.
  goals:
    - name: "dota_figurine"
      target_position: [2.8, 1.5, -1.8]     # [x, y, z] — fill from headset pose
      goal_description: "Navigate towards the dota figurine. It is a small figurine of a dota character, tidehunter."
      goal_reached_threshold: 0.5            # Metres; run stops when agent is this close

    - name: "outside"
      target_position: [7.0, 1.5, -6.2]
      goal_description: "Walk towards the outside of the room."
      goal_reached_threshold: 1.0

    - name: "tree_outside"
      target_position: [7.2, 1.5, -7.59]
      goal_description: "Head towards the tree outside the building."
      goal_reached_threshold: 0.5

    - name: "steamvr_home"
      target_position: [6.64, 1.5, -10.35]
      goal_description: "Head towards the steamvr wall/logo located in the inside of the room."
      goal_reached_threshold: 0.5

# ---------- Output ----------
output:
  results_dir: "agent_navigation_tests/results"
  save_trajectories: true
  save_per_tick_logs: true
